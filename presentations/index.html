<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentations - SEMCL.ONE Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #9B0002;
            --primary-dark: #7A0001;
            --text-dark: #1a1a1a;
            --text-gray: #666666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: #fff;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        header h1 strong {
            font-weight: 700;
            color: var(--primary);
        }

        header a {
            color: var(--text-dark);
            text-decoration: none;
        }

        main {
            margin-top: 68px;
            padding: 4rem 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumb {
            color: var(--text-gray);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        h2 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-gray);
        }

        .empty-state .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .file-list {
            list-style: none;
            margin-top: 2rem;
        }

        .file-list li {
            padding: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .file-list a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .file-list a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            margin-top: 2rem;
            padding: 0.5rem 1.5rem;
            border: 2px solid var(--primary);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="../"><strong>SEMCL.ONE</strong> Community</a></h1>
    </header>

    <main>
        <div class="container">
            <nav class="breadcrumb">
                <a href="../">Home</a> / Presentations
            </nav>

            <h2>🎯 Presentations</h2>

            <div class="empty-state">
                <div class="emoji">🎤</div>
                <h3>No presentations yet</h3>
                <p>Presentations will appear here once they're added to this folder.</p>
                <p style="margin-top: 1rem; font-size: 0.9rem;">Add HTML presentation files to the <code>presentations/</code> directory to get started.</p>
            </div>

            <!-- When you add presentations, uncomment and populate this section:
            <ul class="file-list">
                <li><a href="intro-to-semcl.html">🎯 Introduction to SEMCL.ONE</a></li>
                <li><a href="architecture-overview.html">🎯 Architecture Overview</a></li>
            </ul>
            -->

            <a href="../" class="back-link">← Back to Home</a>
        </div>
    </main>
</body>
</html>
