# Jekyll Configuration for SEMCL.ONE Community Site
# Last updated: 2025-11-24

# Site settings
title: SEMCL.ONE Community
description: Community hub for SEMCL.ONE - Explore guides, presentations, and examples
baseurl: "" # The subpath of your site, e.g. /blog
url: "https://community.semcl.one" # The base hostname & protocol for your site

# Build settings
markdown: kramdown
permalink: pretty

# Directory structure
source: .
destination: ./_site
layouts_dir: _layouts
includes_dir: _includes
data_dir: _data

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .git
  - .gitignore
  - .claude
  - "*.bak"
  - JEKYLL_GUIDE.md

# Include files
include:
  - _redirects

# Collections
collections:
  examples:
    output: true
    permalink: /examples/:name/
  user_guides:
    output: true
    permalink: /user_guides/:name/
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "examples"
    values:
      layout: "article"
      show_breadcrumb: true
      breadcrumb_parent: Examples
      breadcrumb_parent_url: /examples/
  - scope:
      path: ""
      type: "user_guides"
    values:
      layout: "article"
      show_breadcrumb: true
      breadcrumb_parent: User Guides
      breadcrumb_parent_url: /user_guides/
  - scope:
      path: ""
      type: "news"
    values:
      layout: "post"
      show_breadcrumb: false
      breadcrumb_parent: News
      breadcrumb_parent_url: /news/

# Site navigation
navigation:
  - title: Home
    url: https://semcl.one/
  - title: News
    url: /news/
  - title: Community
    url: https://community.semcl.one/
  - title: GitHub
    url: https://github.com/SemClone/
    external: true
  - title: About
    url: /news/2025/12/04/welcome-to-semclone-community/

# Site configuration
logo_url: https://semcl.one/imgs/logo_blanco_apaisado.png
footer_text: "© 2025 SEMCL.ONE"
footer_link_text: semcl.one
footer_link_url: https://semcl.one

# Authors
authors:
  community:
    name: Copycat Community
    display_name: Copycat Community
    gravatar: 8ca6322d6923e6b59ef8178d4939de7832cbdc539697508f94e00583248bd603
    email: semclone_avatar.yc5md@passmail.net
    web: https://community.semcl.one
    twitter: https://twitter.com/semclone
    linkedin: https://www.linkedin.com/company/semclone/
    description: "We are building the future of Open Source Software compliance with AI-powered tools to make compliance accessible to everyone."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Pagination
paginate: 6
paginate_path: /news/page:num/

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

# Feed configuration
feed:
  collections:
    news:
      path: "/feed.xml"
  excerpt_only: false
