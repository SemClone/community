# User Guides content - Edit this file to add/remove/update user guides

sections:
  - title: User Products
    status: available  # Options: available, development
    items:
      - title: BinarySniffer - Binary Static Analysis
        url: "https://github.com/SemClone/binarysniffer/blob/main/docs/USER_GUIDE.md"
        description: BinarySniffer is a high-performance CLI tool for detecting open source components in binary files. It can analyze executables, shared libraries, APK files, and other binary formats to identify embedded binary blobs.

      - title: OSSLiLi - License and Copyright extraction
        url: "https://github.com/SemClone/osslili/blob/main/docs/USAGE.md"
        description: Instructions for using the osslili package to identify licenses and extract copyright information from local source code.

      - title: OSPAC (Open Source Policy as Code) policy engine
        url: "https://github.com/SemClone/ospac/blob/main/docs/USER_GUIDE.md"
        description: Declarative, data-driven approach where all compliance logic, rules, and decisions are defined in versionable policy files rather than hardcoded in application logic.

      - title: UPMEX - Universal Package Metadata Extractor
        url: "https://semclone.github.io/upmex/"
        description: How to extract standardized metadata, licenses, and dependency information from packages across 13 ecosystems, covering installation, the CLI commands, and the supported package formats.

  - title: Technical Architecture
    status: available  # Options: available, development
    items:
      - title: SPDX License Data Management
        url: "https://github.com/SemClone/osslili/blob/main/docs/SPDX.md"
        description: This document describes how to update the bundled SPDX license data used by osslili for license detection, which is used by all other products.

      - title: BinarySniffer Signature Management
        url: "https://github.com/SemClone/binarysniffer/blob/main/docs/SIGNATURE_MANAGEMENT.md"
        description: How to create, update, and manage signature databases for the BinarySniffer.

      - title: OSPAC LLM Prompts for SPDX Licenses
        url: "https://github.com/SemClone/ospac/blob/main/docs/LLM_PROMPTS.md"
        description: AI prompts OSPAC uses to analyze software licenses and extract structured data.

      - title: UPMEX Python API
        url: "https://semclone.github.io/upmex/api/"
        description: Reference for embedding UPMEX as a library, including the extractor interfaces, the metadata objects it returns, and how to wire it into your own tooling.
