{% if page.show_breadcrumb %}
<div class="breadcrumb">
    <a href="/">Community</a>
    {% if page.breadcrumb_parent %}
        <span> / </span>
        {% if page.breadcrumb_parent_url %}
            <a href="{{ page.breadcrumb_parent_url }}">{{ page.breadcrumb_parent }}</a>
        {% else %}
            <span>{{ page.breadcrumb_parent }}</span>
        {% endif %}
    {% endif %}
    {% if page.breadcrumb %}
        <span> / </span>
        <span>{{ page.breadcrumb }}</span>
    {% endif %}
</div>
{% endif %}
